services:
  collaboration:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env.production
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - floatcode_yjs:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  floatcode_yjs:
