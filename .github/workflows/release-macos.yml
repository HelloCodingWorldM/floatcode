name: Build macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mac-signing-fix
    tags:
      - "v*"
    paths:
      - "electron/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "build/**"
      - "scripts/verify-mac-package.py"
      - "vite.config.mjs"
      - ".env.production"
      - ".github/workflows/release-macos.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build ad-hoc signed test package
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify packaged signature and native startup
        run: python3 scripts/verify-mac-package.py
      - name: Record package checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FloatCode-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-mac-*.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FloatCode-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/*
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "FloatCode ${GITHUB_REF_NAME}"
          fi
