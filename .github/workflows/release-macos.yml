name: Build macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "electron/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "build/**"
      - "scripts/**"
      - "tests/**"
      - "vite.config.mjs"
      - ".env.production"
      - ".github/workflows/release-macos.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build ad-hoc signed test package
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify bundle signatures
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          apps = list(pathlib.Path('release').glob('mac*/FloatCode.app'))
          assert apps, 'Packaged app missing'
          for app in apps:
              subprocess.run(['codesign', '--verify', '--deep', '--strict', '--verbose=2', str(app)], check=True)
          PY
      - name: Record checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS-mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FloatCode-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-mac-*.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FloatCode-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v${VERSION}-beta.1"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its published files."
            exit 0
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease --title "FloatCode ${VERSION} — macOS beta" --notes-file docs/macos-release.md
