name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main, windows-beta]
    paths:
      - "electron/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "index.html"
      - "package*.json"
      - "vite.config.mjs"
      - ".env.production"
      - ".github/workflows/release-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test native Windows window and preload
        run: npm run test:desktop
      - name: Build per-user Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Record installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File release/SHA256SUMS-Windows.txt -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FloatCode-Windows-x64
          path: |
            release/*-Setup.exe
            release/SHA256SUMS-Windows.txt
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FloatCode-Windows-x64
          path: release
      - name: Publish versioned Windows beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="windows-v${VERSION}-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its published files."
            exit 0
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease --title "FloatCode ${VERSION} — Windows beta" --notes-file docs/windows-release.md
